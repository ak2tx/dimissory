name: ci
on: [push, pull_request]

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: import on every platform
        run: python -c "import sys; sys.path.insert(0,'src'); import dimissory, dimissory.cli, dimissory.observe, dimissory.render"
      - name: the trust contract
        run: python tests/test_contract.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: install the wheel and run the CLI
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/dim --version
          /tmp/v/bin/dim --dir /tmp/letters write --session ci
          /tmp/v/bin/dim --dir /tmp/letters show
